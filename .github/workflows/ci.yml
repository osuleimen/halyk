name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install black ruff mypy pytest pytest-asyncio
      - run: black --check app/ config.py
      - run: ruff check app/ config.py
      - run: mypy app/ --ignore-missing-imports
      - run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - run: docker compose up -d && sleep 20 && curl -s http://127.0.0.1:18080/health | grep -q '"status": "ok"'
      - run: docker compose logs halyk --tail 30
      - run: docker compose down

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy to halyk.wit.kz via SSH (add secrets.HALYK_SSH_KEY)"
