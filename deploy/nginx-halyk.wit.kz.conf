# /etc/nginx/sites-available/halyk.wit.kz  — аккуратно добавить, не затирая существующий reverse
# Включи этот файл симлинком: ln -s /etc/nginx/sites-available/halyk.wit.kz /etc/nginx/sites-enabled/halyk.wit.kz
# Проверь: nginx -t && systemctl reload nginx
# Требует уже настроенного certbot/ACME для halyk.wit.kz

# Upstream — docker-compose публикует 127.0.0.1:8000
upstream halyk_agent {
    server 127.0.0.1:8000 fail_timeout=5s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    server_name halyk.wit.kz;
    # HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name halyk.wit.kz;

    # --- TLS (замени на свои пути, если у тебя уже есть) ---
    # ssl_certificate /etc/letsencrypt/live/halyk.wit.kz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/halyk.wit.kz/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Если сертификат уже настроен в другом server-блоке — раскомментируй и укажи пути,
    # либо подключи общий include.

    # --- security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;

    # --- logs ---
    access_log /var/log/nginx/halyk.wit.kz.access.log;
    error_log  /var/log/nginx/halyk.wit.kz.error.log warn;

    location / {
        proxy_pass http://halyk_agent;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / WebSocket логи агента
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }

    # Статика — кэшируем, но HTML — нет (чтобы UI всегда свежий)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://halyk_agent;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health for monitoring (optional)
    location = /healthz {
        proxy_pass http://halyk_agent/api/status;
        access_log off;
    }
}

